name: CodeQL

# CodeQL code scanning (#282): the C# solution, the C++ proxy DLL and the workflows themselves. Results appear under
# Security > Code scanning. Notes: docs/reference/dependencies.md#security-scanning

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ main ]
  schedule:
    - cron: '23 4 * * 2' # Tuesdays 04:23 UTC, after Monday's Dependabot updates
  workflow_dispatch:

# A new push to a PR cancels that PR's in-flight run.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          # C# without a build: CodeQL restores the NuGet packages itself (C# 14, .NET 10 and .slnx are supported).
          - language: csharp
            build-mode: none
            os: ubuntu-latest
          # The 32-bit FFXiMain.dll proxy, compiled with MSVC x86 by build_proxy.bat so CodeQL sees the real build.
          - language: c-cpp
            build-mode: manual
            os: windows-latest
          # The GitHub Actions workflows (script injection, over-broad permissions).
          - language: actions
            build-mode: none
            os: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build the proxy DLL (x86)
        if: matrix.build-mode == 'manual'
        shell: cmd
        run: call src\Gordian.Proxy\build_proxy.bat

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
