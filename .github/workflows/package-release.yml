name: Package Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write          # upload release assets
  id-token: write          # Sigstore signing certificate for attestations
  attestations: write      # store build provenance and SBOM attestations
  artifact-metadata: write # artifact storage records for attestations

env:
  # CycloneDX .NET tool that writes each release's SBOM (#278)
  CYCLONEDX_VERSION: '6.2.0'

jobs:
  package-windows:
    name: Package Windows (x64)
    runs-on: windows-latest
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag')
    steps:
      - name: Determine target release tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.vars.outputs.tag }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish Gordian.App (win-x64, self-contained)
        run: |
          dotnet publish src/Gordian.App/Gordian.App.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -o staging/GordianXI

      - name: Assemble Portable Folder Structure
        shell: bash
        run: |
          mkdir -p staging/GordianXI/addons
          mkdir -p staging/GordianXI/scripts
          mkdir -p staging/GordianXI/profiles
          mkdir -p staging/GordianXI/logs

          # Place gitkeep files so empty directories are preserved in the archive
          touch staging/GordianXI/addons/.gitkeep
          touch staging/GordianXI/scripts/.gitkeep
          touch staging/GordianXI/profiles/.gitkeep
          touch staging/GordianXI/logs/.gitkeep

      - name: Create Zip Archive and SHA256
        id: archive
        shell: bash
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          mkdir -p dist
          ARCHIVE_NAME="GordianXI-${TAG}-win-x64.zip"
          # The Windows runner has no `zip` in Git Bash; 7-Zip ships with the image.
          SEVENZIP="$(command -v 7z || echo '/c/Program Files/7-Zip/7z.exe')"
          (cd staging && "$SEVENZIP" a -tzip -mx=9 "../dist/${ARCHIVE_NAME}" GordianXI)
          (cd dist && sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256")
          echo "archive=dist/${ARCHIVE_NAME}" >> $GITHUB_OUTPUT
          echo "sbom=dist/GordianXI-${TAG}-win-x64.cdx.json" >> $GITHUB_OUTPUT

      - name: Generate SBOM (CycloneDX)
        shell: bash
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          dotnet tool install CycloneDX --version "$CYCLONEDX_VERSION" --tool-path .tools
          ./.tools/dotnet-CycloneDX src/Gordian.App/Gordian.App.csproj --recursive --include-project-references \
            --exclude-dev --configuration Release --runtime win-x64 --framework net10.0 \
            --set-name GordianXI --set-version "$TAG" --output-format Json \
            --output dist --filename "GordianXI-${TAG}-win-x64.cdx.json"

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.archive.outputs.archive }}

      - name: Attest SBOM
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.archive.outputs.archive }}
          sbom-path: ${{ steps.archive.outputs.sbom }}

      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          gh release upload "$TAG" dist/* --clobber

  package-linux:
    name: Package Linux (x64)
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag')
    steps:
      - name: Determine target release tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.vars.outputs.tag }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish Gordian.App (linux-x64, self-contained)
        run: |
          dotnet publish src/Gordian.App/Gordian.App.csproj -c Release -r linux-x64 --self-contained true -p:PublishReadyToRun=true -o staging/GordianXI

      - name: Assemble Portable Folder Structure
        shell: bash
        run: |
          mkdir -p staging/GordianXI/addons
          mkdir -p staging/GordianXI/scripts
          mkdir -p staging/GordianXI/profiles
          mkdir -p staging/GordianXI/logs

          touch staging/GordianXI/addons/.gitkeep
          touch staging/GordianXI/scripts/.gitkeep
          touch staging/GordianXI/profiles/.gitkeep
          touch staging/GordianXI/logs/.gitkeep

      - name: Create Tarball Archive and SHA256
        id: archive
        shell: bash
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          mkdir -p dist
          ARCHIVE_NAME="GordianXI-${TAG}-linux-x64.tar.gz"
          tar -czvf "dist/${ARCHIVE_NAME}" -C staging GordianXI
          (cd dist && sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256")
          echo "archive=dist/${ARCHIVE_NAME}" >> $GITHUB_OUTPUT
          echo "sbom=dist/GordianXI-${TAG}-linux-x64.cdx.json" >> $GITHUB_OUTPUT

      - name: Generate SBOM (CycloneDX)
        shell: bash
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          dotnet tool install CycloneDX --version "$CYCLONEDX_VERSION" --tool-path .tools
          ./.tools/dotnet-CycloneDX src/Gordian.App/Gordian.App.csproj --recursive --include-project-references \
            --exclude-dev --configuration Release --runtime linux-x64 --framework net10.0 \
            --set-name GordianXI --set-version "$TAG" --output-format Json \
            --output dist --filename "GordianXI-${TAG}-linux-x64.cdx.json"

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.archive.outputs.archive }}

      - name: Attest SBOM
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.archive.outputs.archive }}
          sbom-path: ${{ steps.archive.outputs.sbom }}

      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          gh release upload "$TAG" dist/* --clobber
