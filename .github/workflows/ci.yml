name: Build & Test

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ main ]
    # Docs-only PRs skip CI. Revisit if CI becomes a required status check:
    # a skipped workflow leaves a required check pending.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# A new push to a PR cancels that PR's in-flight run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore NuGet dependencies
        run: dotnet restore

      - name: Compile solution (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test --configuration Release --no-build --verbosity normal --results-directory "${{ github.workspace }}/TestResults" --logger "trx"

      - name: Publish Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Test Results (${{ matrix.os }})
          path: '${{ github.workspace }}/TestResults/*.trx'
          path-replace-backslashes: 'true'
          reporter: dotnet-trx
