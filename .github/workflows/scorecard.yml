name: OpenSSF Scorecard

# Grades the repository's supply-chain practices (pinned actions, branch protection, signed releases...) every week
# and on changes to main (#282). Results go to Security > Code scanning and to the public badge in README.md.
# Publishing the results needs this file to stay simple: no workflow-level env or defaults, no write permissions at
# workflow level, and only the steps below. See https://github.com/ossf/scorecard-action#workflow-restrictions

on:
  branch_protection_rule:
  push:
    branches: [ main ]
  schedule:
    - cron: '41 4 * * 2' # Tuesdays 04:41 UTC
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write # upload the results to code scanning
      id-token: write        # publish the results to the OpenSSF API (for the badge)

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
