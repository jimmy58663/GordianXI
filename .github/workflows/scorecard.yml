name: OpenSSF Scorecard

# Grades the repository's supply-chain practices (pinned actions, branch protection, signed releases...) every week
# and on changes to main (#282). Results go to Security > Code scanning and to the public badge in README.md.
# Publishing the results needs this file to stay simple: no workflow-level env or defaults, no write permissions at
# workflow level, and only the steps below. See https://github.com/ossf/scorecard-action#workflow-restrictions

on:
  branch_protection_rule:
  push:
    branches: [ main ]
  schedule:
    - cron: '41 4 * * 2' # Tuesdays 04:41 UTC
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write # upload the results to code scanning
      id-token: write        # publish the results to the OpenSSF API (for the badge)

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # scorecard-action has no floating major tag; Dependabot bumps the release tag.
      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v7
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
