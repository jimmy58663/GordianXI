name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '🆕 Features & Enhancements'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
      - 'fix'
  - title: '⚡ Performance & Protocol'
    labels:
      - 'performance'
      - 'protocol'
      - 'network'
  - title: '📚 Documentation'
    labels:
      - 'documentation'
  - title: '🧹 Maintenance & Dependencies'
    labels:
      - 'chore'
      - 'dependencies'
change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
no-changes-template: '- No changes'
template: |
  ## What's Changed

  $CHANGES

  ## Verify your download
  Each archive has build provenance and a CycloneDX SBOM (`*.cdx.json`), signed by this repository's release workflow. With the [GitHub CLI](https://cli.github.com/):
  ```
  gh attestation verify <archive> -R jimmy58663/GordianXI
  gh attestation verify <archive> -R jimmy58663/GordianXI --predicate-type https://cyclonedx.org/bom
  ```
  The `.sha256` files give plain checksums. These are not code signatures: Windows SmartScreen still warns until the binaries are code-signed (#279).

version-resolver:
  major:
    labels:
      - 'release: major'
  minor:
    labels:
      - 'release: minor'
  patch:
    labels:
      - 'release: patch'
  default: patch
